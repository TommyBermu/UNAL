; Proyecto PlatformIO: dispositivo IoT que verifica firmware por WiFi.
;
; Dos entornos a partir del MISMO codigo (src/main.cpp):
;   - env:camera -> compila el ESP32 como "camara"
;   - env:sensor -> compila el ESP32 como "sensor"
; La unica diferencia es el flag DEVICE_TYPE, que decide que es cada placa.
;
; Antes de compilar, edita WIFI_SSID, WIFI_PASS y SERVER_URL abajo
; (o mejor, en include/config.h) con los datos de TU red y la IP de tu PC.
;
; Para elegir el entorno en VSCode: barra inferior de PlatformIO -> "env:camera"
; o "env:sensor". O por terminal:  pio run -e camera -t upload
;
; mbedTLS (SHA-256 y ECDSA P-256) ya viene con el framework Arduino-ESP32,
; no hay que anadir librerias externas.

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
board = esp32dev            ; cambia a tu placa si es otra (ej. esp32doit-devkit-v1)
; Velocidad de flasheo. Si el upload falla con "Failed to start stub flasher"
; o el serie es inestable, baja a 115200 (mas lento pero mas fiable).
upload_speed = 460800
build_flags =
    -DCORE_DEBUG_LEVEL=0

[env:camera]
; Con UNA sola placa conectada, PlatformIO autodetecta el puerto.
; Si conectas las dos a la vez, descomenta y ajusta (ls -l /dev/ttyUSB*):
; upload_port = /dev/ttyUSB0
; monitor_port = /dev/ttyUSB0
build_flags =
    ${env.build_flags}
    -DDEVICE_TYPE=\"camera\"

[env:sensor]
; upload_port = /dev/ttyUSB1
; monitor_port = /dev/ttyUSB1
build_flags =
    ${env.build_flags}
    -DDEVICE_TYPE=\"sensor\"

; Entorno de PRUEBA de hardware/conectividad.
; Compila test_hw/test_conectividad.cpp en lugar de src/main.cpp.
; Uso:  pio run -e test -t upload -t monitor
[env:test]
build_src_filter = -<*> +<../test_hw/test_conectividad.cpp>
build_flags =
    ${env.build_flags}
    -DDEVICE_TYPE=\"test\"
