services:
  proxy:
    image: nginx
    volumes:
      - type: bind
        source: ./proxy/nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
    ports:
      - 80:80
    depends_on:
      - backend

  backend:
    build:
      context: backend
      target: builder

  # Paso 13: servicio con la imagen NGINX personalizada (Pasos 11 y 12)
  static-web:
    build:
      context: nginx-static
    image: some-content-nginx:v2
    ports:
      - 8082:80
